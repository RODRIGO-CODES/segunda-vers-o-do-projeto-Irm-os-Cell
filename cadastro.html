<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irmãos Cell - Trabalhe Conosco</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <h1 class="logo">Irmãos Cell</h1>
      <nav class="menu-principal" id="menu">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projeto.html">Serviços</a></li>
          <li><a href="cadastro.html" class="ativo">Trabalhe Conosco</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" onclick="document.getElementById('menu').classList.toggle('aberto')">☰</button>
    </div>
  </header>

  <main class="conteudo-principal container">
    <h2>Trabalhe Conosco</h2>
    <form class="formulario">
      <label>Nome Completo:</label>
      <input type="text" placeholder="Seu nome" required>

      <label>Email:</label>
      <input type="email" placeholder="seuemail@exemplo.com" required>

      <label>Área de Interesse:</label>
      <select required>
        <option value="">Selecione</option>
        <option>Vendas</option>
        <option>Assistência Técnica</option>
        <option>Atendimento</option>
      </select>

      <label>Mensagem:</label>
      <textarea rows="4" placeholder="Fale sobre você"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>&copy; 2025 Irmãos Cell - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
</html>
